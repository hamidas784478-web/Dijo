{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>تاریخچه فعالیت</h1><p>ثبت عملیات مهم انجام‌شده در دیجو</p></div></div>

<section class="panel"><div class="table-wrap"><table><thead><tr><th>کاربر</th><th>فعالیت</th><th>زمان</th></tr></thead><tbody>{% for a in rows %}<tr><td>{{a.user_name}}</td><td>{{a.action}}</td><td>{{a.created_at[:16].replace('T',' ')}}</td></tr>{% else %}<tr><td colspan="3" class="empty">هنوز فعالیتی ثبت نشده.</td></tr>{% endfor %}</tbody></table></div></section>

{% endblock %}
