
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی رمز | دیجو</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="auth-bg"><div class="auth-card"><img class="auth-logo small" src="{{url_for('static',filename='images/logo.jpg')}}"><h1>بازیابی رمز عبور</h1><p>نام کاربری را وارد کنید.</p>

<form method="post"><label>نام کاربری<input name="username" required></label><button class="btn primary full">ارسال درخواست</button></form>
<div class="auth-foot"><a href="{{url_for('login')}}">بازگشت به ورود</a></div></div></body></html>
