{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>تأمین‌کنندگان</h1><p>مدیریت تأمین‌کنندگان و سوابق خرید</p></div></div>

<div class="two-col"><section class="panel"><div class="panel-head"><h3>افزودن تأمین‌کننده</h3></div><form method="post" class="form-grid"><label>نام تأمین‌کننده<input name="name" required></label><label>شماره تماس<input name="phone"></label><label>آدرس<input name="address"></label><label>یادداشت<textarea name="notes"></textarea></label><button class="btn primary">افزودن</button></form></section>
<section class="panel"><div class="panel-head"><h3>لیست تأمین‌کنندگان</h3></div><div class="table-wrap"><table><thead><tr><th>نام</th><th>تماس</th><th>آدرس</th><th>حساب</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone or '—'}}</td><td>{{r.address or '—'}}</td><td><a class="btn small" href="{{url_for('payments',entity_type='supplier',id=r.id)}}">حساب</a></td></tr>{% else %}<tr><td colspan="4" class="empty">موردی نیست.</td></tr>{% endfor %}</tbody></table></div></section></div>

{% endblock %}
