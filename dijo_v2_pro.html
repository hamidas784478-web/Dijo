<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دیجو | مدیریت کسب‌وکار</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --bubble-user: #6d5dfc;
    --bubble-dijo: #1b1f2a;
    --text: #eceef3;
    --text-dim: #8a90a2;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --error: #ff6b6b;
    --success: #4ade80;
    --warn: #fbbf24;
    --border: #232734;
    --card: #161a23;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-title { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px;
  }

  .header-text .name { font-weight: bold; font-size: 17px; }
  .header-text .status { font-size: 12px; color: var(--text-dim); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-left: 4px; }

  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }

  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #1a1e28;
    color: var(--text-dim);
    font-size: 13.5px;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--accent);
    color: white;
    border-color: transparent;
  }

  .screen { display: none; padding: 0; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; flex: 1 1 auto; min-height: 0; }
  .screen.active .panel-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  #screen-chat.active { flex-direction: column; overflow: hidden; }

  .chat { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.user { align-self: flex-start; align-items: flex-start; }
  .row.dijo { align-self: flex-end; align-items: flex-end; }

  .bubble {
    padding: 12px 15px; border-radius: 16px; line-height: 1.75;
    font-size: 15.5px; white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble { background: var(--bubble-user); color: white; }
  .row.dijo .bubble { background: var(--bubble-dijo); border: 1px solid var(--border); }
  .row.dijo .bubble.error { background: rgba(255,107,107,0.1); border-color: rgba(255,107,107,0.3); color: var(--error); }

  .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; padding: 0 4px; }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    min-width: 0;
    max-height: 120px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #1a1e28;
    color: var(--text);
    font-size: 15.5px;
    direction: rtl;
    font-family: inherit;
  }

  .send-btn {
    width: 46px; height: 46px; border: none; border-radius: 50%;
    background: var(--accent); color: white; font-size: 20px;
  }

  .panel-body { padding: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .card-value { font-size: 20px; font-weight: bold; }
  .card-value.pos { color: var(--success); }
  .card-value.neg { color: var(--error); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .form-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .form-box input, .form-box select {
    width: 100%;
    background: #1a1e28;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14.5px;
    margin-bottom: 8px;
    direction: rtl;
    font-family: inherit;
  }

  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; min-width: 0; }

  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: white; border: none; border-radius: 10px;
    padding: 11px; font-size: 14.5px; font-weight: bold;
  }

  .list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .title { font-size: 14.5px; font-weight: bold; }
  .list-item .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .badge.income { background: rgba(74,222,128,0.15); color: var(--success); }
  .badge.expense { background: rgba(255,107,107,0.15); color: var(--error); }
  .badge.low { background: rgba(251,191,36,0.15); color: var(--warn); }
  .badge.debt { background: rgba(255,107,107,0.15); color: var(--error); }
  .badge.credit { background: rgba(74,222,128,0.15); color: var(--success); }
  .badge.settled { background: rgba(148,163,184,0.15); color: var(--text-dim); }
  .mini-btn { font-size: 11.5px; padding: 5px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }

  .del-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .check-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); background: none; color: white; font-size: 13px; }
  .check-btn.done { background: var(--success); border-color: var(--success); }

  .empty-hint { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 24px 10px; }
  .section-label { font-size: 13px; color: var(--text-dim); margin: 14px 0 8px 0; }

  .order-item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .order-item-row select { flex: 2; margin-bottom: 0; }
  .order-item-row input { flex: 1; margin-bottom: 0; }

  .link-btn {
    background: none; border: 1px dashed var(--border); color: var(--accent-2);
    font-size: 13px; padding: 8px; width: 100%; border-radius: 8px; margin-bottom: 8px;
  }

  /* ── Auth Overlay ── */
  #authOverlay {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #authOverlay.visible { display: flex; }
  .auth-box {
    width: 100%; max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
  }
  .auth-logo { text-align: center; font-size: 36px; margin-bottom: 6px; }
  .auth-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
  .auth-sub { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }
  .auth-box input {
    width: 100%; background: #1a1e28; border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px;
    font-size: 15px; margin-bottom: 10px; direction: rtl; font-family: inherit;
  }
  .auth-btn {
    width: 100%; background: var(--accent); color: white;
    border: none; border-radius: 10px; padding: 13px;
    font-size: 15px; font-weight: bold; margin-top: 4px;
  }
  .auth-error { color: var(--error); font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  /* ── Header actions ── */
  .header-actions { display: flex; gap: 6px; }
  .header-actions .icon-btn { font-size: 12px; padding: 7px 10px; }

  /* ── Hamburger button ── */
  .hamburger-btn {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 4px;
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #1a1e28;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hamburger-btn span {
    display: block; width: 18px; height: 2px; border-radius: 2px;
    background: var(--text);
    transition: transform .25s ease, opacity .2s ease;
  }
  .hamburger-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .hamburger-btn.open span:nth-child(2) { opacity: 0; }
  .hamburger-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  /* ── Drawer overlay + panel ── */
  .drawer-overlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(4,5,8,0.6);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .drawer-overlay.visible { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 82%; max-width: 320px;
    background: linear-gradient(180deg, #151824 0%, #10121a 100%);
    border-left: 1px solid var(--border);
    z-index: 950;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.22,.9,.32,1);
    box-shadow: -18px 0 40px rgba(0,0,0,0.45);
    overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; gap: 12px;
    padding: 22px 18px 18px 18px;
    border-bottom: 1px solid var(--border);
    position: relative;
    background: radial-gradient(120% 140% at 100% 0%, rgba(139,92,246,0.28), transparent 60%);
  }
  .drawer-avatar {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 18px; color: white; flex-shrink: 0;
  }
  .drawer-user { flex: 1; min-width: 0; }
  .drawer-name { font-weight: bold; font-size: 16px; }
  .drawer-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .drawer-close {
    position: absolute; top: 14px; left: 14px;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    color: var(--text-dim); font-size: 14px; cursor: pointer;
  }

  .drawer-section { padding: 10px 10px; }
  .drawer-label {
    font-size: 11px; color: var(--text-dim); padding: 10px 12px 6px 12px;
    letter-spacing: .3px;
  }
  .drawer-item {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    background: none; border: none; color: var(--text);
    padding: 12px 12px; border-radius: 12px;
    font-size: 14.5px; text-align: right; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .drawer-item:active { background: rgba(255,255,255,0.06); }
  .drawer-item.active {
    background: linear-gradient(90deg, rgba(139,92,246,0.22), rgba(34,211,238,0.08));
    color: white;
  }
  .drawer-item.active .drawer-icon { filter: none; }
  .drawer-item.danger { color: var(--error); }
  .drawer-icon {
    width: 30px; height: 30px; border-radius: 9px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .drawer-divider { height: 1px; background: var(--border); margin: 6px 14px; }
  .drawer-footer {
    margin-top: auto; padding: 14px 18px 20px 18px;
    font-size: 11px; color: var(--text-dim); text-align: center;
    border-top: 1px solid var(--border);
  }

/* ================= DIJO v2 UI layer ================= */
:root{
  --shadow: 0 12px 35px rgba(0,0,0,.22);
  --radius-lg: 18px;
}
button,input,textarea,select{min-height:44px}
button{cursor:pointer}
.card,.form-box,.list-item{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover,.list-item:hover{box-shadow:var(--shadow);border-color:rgba(139,92,246,.35)}
.submit-btn,.send-btn,.auth-btn{transition:transform .15s ease,filter .15s ease}
.submit-btn:active,.send-btn:active,.auth-btn:active{transform:scale(.97)}
.v2-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.v2-toolbar input,.v2-toolbar select{flex:1;min-width:145px}
.v2-chip{border:1px solid var(--border);background:#1a1e28;color:var(--text-dim);border-radius:12px;padding:8px 12px;min-height:40px}
.v2-chip.active{background:var(--accent);color:#fff;border-color:transparent}
.v2-kpi{display:flex;align-items:center;justify-content:space-between;gap:10px}
.v2-kpi-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,.14);font-size:18px}
.v2-alert{border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.07);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.v2-success{border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.06)}
.v2-empty{padding:28px 14px;text-align:center;color:var(--text-dim)}
.v2-fab{position:fixed;left:16px;bottom:84px;width:46px;height:46px;border:1px solid var(--border);border-radius:50%;background:var(--panel);color:var(--text);box-shadow:var(--shadow);z-index:800;display:none}
.v2-fab.show{display:block}
.v2-typing{display:flex;gap:5px;align-items:center}
.v2-typing i{width:7px;height:7px;border-radius:50%;background:var(--text-dim);animation:dijoBounce 1.1s infinite ease-in-out}
.v2-typing i:nth-child(2){animation-delay:.15s}.v2-typing i:nth-child(3){animation-delay:.3s}
@keyframes dijoBounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.v2-typing-text{font-size:11px;color:var(--text-dim);margin-right:5px}
.v2-settings{border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
body.light-theme{
  --bg:#f5f7fb;--panel:#fff;--bubble-dijo:#eef1f7;--text:#18202d;--text-dim:#667085;
  --border:#dfe4ec;--card:#fff;
}
body.light-theme .tab-btn,body.light-theme textarea,body.light-theme input,body.light-theme select,
body.light-theme .hamburger-btn,body.light-theme .v2-chip{background:#f7f8fb;color:var(--text)}
@media(max-width:520px){
  .grid-2{grid-template-columns:1fr 1fr}
  .panel-body{padding:12px}
  .v2-toolbar input,.v2-toolbar select{min-width:120px}
}


/* ================= DIJO v2 — PRO UI REDESIGN ================= */
:root{
  --bg:#070910;
  --surface:#0d111b;
  --surface2:#121826;
  --surface3:#171e2d;
  --text:#f5f7fb;
  --muted:#8d98aa;
  --border:rgba(255,255,255,.075);
  --accent:#8b5cf6;
  --accent2:#6366f1;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --info:#38bdf8;
  --radius:20px;
  --shadow:0 18px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 80% -10%,rgba(139,92,246,.16),transparent 34%),
    radial-gradient(circle at -10% 30%,rgba(56,189,248,.07),transparent 30%),
    var(--bg);
  color:var(--text);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:36px 36px;
}
button,input,textarea,select{min-height:44px}
button{font-family:inherit}
input,textarea,select{
  border:1px solid var(--border)!important;
  background:rgba(255,255,255,.035)!important;
  border-radius:14px!important;
  transition:.2s ease;
}
input:focus,textarea:focus,select:focus{
  border-color:rgba(139,92,246,.7)!important;
  box-shadow:0 0 0 4px rgba(139,92,246,.1)!important;
  outline:none;
}
button{
  border-radius:13px!important;
  transition:transform .15s ease,box-shadow .2s ease,filter .2s ease;
}
button:active{transform:scale(.97)}
/* top/header */
.topbar,.header{
  background:rgba(8,11,18,.78)!important;
  backdrop-filter:blur(18px);
  border-color:var(--border)!important;
  box-shadow:0 8px 35px rgba(0,0,0,.15);
}
.logo,.brand{
  text-shadow:0 0 28px rgba(139,92,246,.35);
}
/* navigation */
.tabbar,.tabs,.bottom-nav{
  background:rgba(10,13,21,.9)!important;
  backdrop-filter:blur(20px);
  border-color:var(--border)!important;
}
.tab-btn,.nav-btn{
  position:relative;
  border:1px solid transparent!important;
  background:transparent!important;
  color:var(--muted)!important;
}
.tab-btn.active,.nav-btn.active{
  color:#fff!important;
  background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(99,102,241,.1))!important;
  border-color:rgba(139,92,246,.22)!important;
  box-shadow:inset 0 0 25px rgba(139,92,246,.06);
}
.tab-btn.active::after,.nav-btn.active::after{
  content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;
  border-radius:2px;background:var(--accent);
  box-shadow:0 0 14px var(--accent);
}
/* panels/cards */
.card,.panel,.form-box,.list-item,.stat-card{
  background:linear-gradient(145deg,rgba(18,24,38,.94),rgba(11,15,24,.94))!important;
  border:1px solid var(--border)!important;
  border-radius:var(--radius)!important;
  box-shadow:0 8px 30px rgba(0,0,0,.16);
}
.card:hover,.panel:hover,.list-item:hover,.stat-card:hover{
  border-color:rgba(139,92,246,.23)!important;
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}
.panel-head,.card-head{
  border-bottom:1px solid var(--border)!important;
  background:linear-gradient(90deg,rgba(139,92,246,.045),transparent);
}
.panel-title,.section-title{
  font-weight:800!important;
}
/* dashboard */
.dashboard-grid,.stats-grid,.kpi-grid{
  gap:14px!important;
}
.stat-card,.kpi-card{
  position:relative;overflow:hidden;
  padding:18px!important;
}
.stat-card::before,.kpi-card::before{
  content:"";position:absolute;right:-28px;top:-35px;width:105px;height:105px;
  border-radius:50%;background:rgba(139,92,246,.09);filter:blur(1px);
}
.stat-card .value,.kpi-value{
  font-size:27px!important;font-weight:900!important;letter-spacing:-.7px;
}
.stat-card .label,.kpi-label{color:var(--muted)!important;font-size:12px}
.v2-kpi-icon{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(99,102,241,.08));
  border:1px solid rgba(139,92,246,.16);
}
/* action buttons */
.submit-btn,.primary-btn,.send-btn,.auth-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2))!important;
  border:0!important;
  box-shadow:0 8px 24px rgba(124,58,237,.22);
}
.submit-btn:hover,.primary-btn:hover,.send-btn:hover,.auth-btn:hover{
  filter:brightness(1.08);box-shadow:0 10px 30px rgba(124,58,237,.32);
}
/* lists */
.list-item{
  padding:14px!important;
  margin-bottom:9px;
}
.list-item .title{font-weight:750}
.badge,.tag,.status{
  border-radius:999px!important;
  border:1px solid var(--border)!important;
  padding:5px 9px!important;
}
/* chat */
.chat,.chat-area{
  background:transparent!important;
}
.bubble{
  border-radius:18px!important;
  border:1px solid var(--border)!important;
  box-shadow:0 7px 24px rgba(0,0,0,.12);
}
.row.dijo .bubble{
  background:linear-gradient(145deg,rgba(139,92,246,.13),rgba(18,24,38,.92))!important;
  border-color:rgba(139,92,246,.16)!important;
}
.row.user .bubble{
  background:linear-gradient(145deg,rgba(99,102,241,.92),rgba(79,70,229,.78))!important;
}
.chat-input,.composer{
  background:rgba(13,17,27,.92)!important;
  backdrop-filter:blur(18px);
  border:1px solid var(--border)!important;
  border-radius:20px!important;
  box-shadow:0 12px 45px rgba(0,0,0,.25);
}
/* v2 toolbar */
.v2-toolbar{
  display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px;
  padding:4px 0;
}
.v2-toolbar input,.v2-toolbar select{flex:1;min-width:140px}
.v2-chip{
  min-height:40px!important;padding:7px 13px!important;
  background:rgba(255,255,255,.035)!important;
  color:var(--muted)!important;border:1px solid var(--border)!important;
}
.v2-chip.active{
  color:#fff!important;border-color:rgba(139,92,246,.4)!important;
  background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(99,102,241,.12))!important;
}
/* alerts */
.v2-alert{
  padding:14px 16px;margin-bottom:10px;border-radius:16px;
  border:1px solid rgba(245,158,11,.22);
  background:linear-gradient(90deg,rgba(245,158,11,.09),rgba(245,158,11,.025));
}
.v2-success{
  border-color:rgba(34,197,94,.22);
  background:linear-gradient(90deg,rgba(34,197,94,.09),rgba(34,197,94,.025));
}
/* floating button */
.v2-fab{
  position:fixed;left:17px;bottom:86px;width:48px;height:48px;
  display:none;place-items:center;z-index:999;
  border:1px solid var(--border)!important;
  border-radius:50%!important;
  background:rgba(18,24,38,.92)!important;color:#fff;
  box-shadow:var(--shadow);
}
.v2-fab.show{display:grid}
/* typing */
.v2-typing{display:flex;gap:5px;align-items:center}
.v2-typing i{
  width:7px;height:7px;border-radius:50%;background:#a78bfa;
  animation:dijoBounce 1.05s infinite ease-in-out;
}
.v2-typing i:nth-child(2){animation-delay:.15s}
.v2-typing i:nth-child(3){animation-delay:.3s}
.v2-typing-text{font-size:11px;color:var(--muted);margin-right:6px}
@keyframes dijoBounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
/* empty/loading */
.v2-empty{padding:35px 15px;text-align:center;color:var(--muted)}
.skeleton{
  background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.09),rgba(255,255,255,.035));
  background-size:200% 100%;animation:shimmer 1.4s infinite;
}
@keyframes shimmer{to{background-position:-200% 0}}
/* light theme */
body.light-theme{
  --bg:#f4f6fa;--surface:#fff;--surface2:#fff;--surface3:#eef1f6;
  --text:#172033;--muted:#687386;--border:rgba(15,23,42,.1);
  background:radial-gradient(circle at 80% -10%,rgba(139,92,246,.1),transparent 35%),var(--bg);
}
body.light-theme::before{opacity:.45}
body.light-theme .topbar,body.light-theme .header,
body.light-theme .tabbar,body.light-theme .tabs,body.light-theme .bottom-nav{
  background:rgba(255,255,255,.82)!important;
}
body.light-theme .card,body.light-theme .panel,body.light-theme .form-box,
body.light-theme .list-item,body.light-theme .stat-card{
  background:linear-gradient(145deg,#fff,#f8f9fc)!important;
}
@media(max-width:700px){
  .stat-card .value,.kpi-value{font-size:23px!important}
  .v2-toolbar{gap:7px}
  .v2-toolbar input,.v2-toolbar select{min-width:calc(50% - 5px)}
  .panel,.card,.form-box,.list-item{border-radius:16px!important}
}
@media(max-width:420px){
  .v2-toolbar input,.v2-toolbar select{min-width:100%}
}

</style>

<script>
"use strict";

/* ============ helpers ============ */

function qs(id) { return document.getElementById(id); }

/* ============ real viewport height (fills screen + follows keyboard) ============ */
/* روی موبایل، 100vh همیشه ارتفاع واقعی صفحه رو نشون نمی‌ده و وقتی کیبورد باز
   می‌شه هم به‌روز نمی‌شه؛ اینجا با visualViewport ارتفاع واقعی رو می‌گیریم و
   مستقیم روی خودِ اپ ست می‌کنیم تا هم صفحه کامل پر بشه هم نوار پیام همیشه
   دقیقاً بالای کیبورد بمونه. */

function setAppHeight() {
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  var app = qs("mainApp");
  if (app) app.style.height = vh + "px";
}

setAppHeight();
window.addEventListener("resize", setAppHeight);
window.addEventListener("orientationchange", function () { setTimeout(setAppHeight, 150); });
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", setAppHeight);
  window.visualViewport.addEventListener("scroll", setAppHeight);
}


/* ============ auth ============ */

var isFirstTime = false;

function showAuthOverlay(firstTime) {
  isFirstTime = !!firstTime;
  qs("authTitle").textContent = firstTime ? "ایجاد حساب دیجو" : "ورود به دیجو";
  qs("authSub").textContent = firstTime ? "اولین بار است. یک رمز عبور انتخاب کنید." : "برای ادامه وارد شوید";
  qs("authSubmitBtn").textContent = firstTime ? "ساخت حساب" : "ورود";
  qs("authError").textContent = "";
  qs("authOverlay").classList.add("visible");
}

function hideAuthOverlay() {
  qs("authOverlay").classList.remove("visible");
  qs("mainApp").style.display = "";
}

function checkAuth() {
  fetch("/auth/status").then(function (r) { return r.json(); }).then(function (data) {
    if (data.logged_in) {
      qs("loggedUser").textContent = data.username;
      qs("drawerUser").textContent = data.username;
      hideAuthOverlay();
      addBubble(WELCOME, "dijo");
    } else {
      showAuthOverlay(data.first_time);
    }
  }).catch(function () {
    showAuthOverlay(false);
  });
}

qs("authSubmitBtn").addEventListener("click", function () {
  var username = qs("authUsername").value.trim();
  var password = qs("authPassword").value.trim();
  if (!username || !password) { qs("authError").textContent = "هر دو فیلد را پر کنید."; return; }

  var endpoint = isFirstTime ? "/auth/register" : "/auth/login";
  qs("authSubmitBtn").disabled = true;

  fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: username, password: password })
  }).then(function (r) { return r.json(); }).then(function (data) {
    qs("authSubmitBtn").disabled = false;
    if (data.ok) {
      qs("loggedUser").textContent = data.username;
      qs("drawerUser").textContent = data.username;
      hideAuthOverlay();
      addBubble(WELCOME, "dijo");
    } else {
      qs("authError").textContent = data.error || "خطا. دوباره امتحان کن.";
    }
  }).catch(function () {
    qs("authSubmitBtn").disabled = false;
    qs("authError").textContent = "خطا در اتصال به سرور.";
  });
});

// Enter key in auth inputs
["authUsername", "authPassword"].forEach(function (id) {
  qs(id).addEventListener("keydown", function (e) {
    if (e.key === "Enter") qs("authSubmitBtn").click();
  });
});

qs("logoutBtn").addEventListener("click", function () {
  if (!confirm("از دیجو خارج شوید؟")) return;
  fetch("/auth/logout", { method: "POST" }).then(function () {
    qs("mainApp").style.display = "none";
    qs("authUsername").value = "";
    qs("authPassword").value = "";
    showAuthOverlay(false);
  });
});

qs("backupBtn").addEventListener("click", function () {
  var a = document.createElement("a");
  a.href = "/api/backup";
  a.click();
});

/* ============ 401 intercept ============ */

function apiFetch(path, options) {
  return fetch(path, options).then(function (res) {
    return res.text().then(function (raw) {
      var data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (e) {}
      if (res.status === 401 && data.login_required) {
        qs("mainApp").style.display = "none";
        showAuthOverlay(false);
        throw new Error("نشست منقضی شده. لطفاً دوباره وارد شوید.");
      }
      if (!res.ok) throw new Error(data.error || ("خطای سرور " + res.status));
      return data;
    });
  });
}

function fmt(n) {
  n = Number(n) || 0;
  return n.toLocaleString("fa-IR");
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = (str === null || str === undefined) ? "" : String(str);
  return div.innerHTML;
}

function api(path, options) {
  return apiFetch(path, options);
}

/* ============ drawer menu ============ */

var menuBtn = qs("menuBtn");
var drawer = qs("drawer");
var drawerOverlay = qs("drawerOverlay");
var drawerCloseBtn = qs("drawerCloseBtn");

function openDrawer() {
  drawer.classList.add("open");
  drawerOverlay.classList.add("visible");
  menuBtn.classList.add("open");
}

function closeDrawer() {
  drawer.classList.remove("open");
  drawerOverlay.classList.remove("visible");
  menuBtn.classList.remove("open");
}

menuBtn.addEventListener("click", function () {
  if (drawer.classList.contains("open")) closeDrawer(); else openDrawer();
});
drawerOverlay.addEventListener("click", closeDrawer);
drawerCloseBtn.addEventListener("click", closeDrawer);

/* ============ tabs ============ */

var tabButtons = document.querySelectorAll(".tab-btn");
var screens = document.querySelectorAll(".screen");

for (var i = 0; i < tabButtons.length; i++) {
  tabButtons[i].addEventListener("click", function (event) {
    var target = event.currentTarget;
    var tabName = target.getAttribute("data-tab");

    for (var j = 0; j < tabButtons.length; j++) { tabButtons[j].classList.remove("active"); }
    for (var k = 0; k < screens.length; k++) { screens[k].classList.remove("active"); }

    target.classList.add("active");
    qs("screen-" + tabName).classList.add("active");
    closeDrawer();

    if (tabName === "dashboard") loadDashboard();
    if (tabName === "customers") loadCustomers();
    if (tabName === "products") { loadProducts(); loadProductProfit(30); }
    if (tabName === "purchases") { loadPurchaseFormData(); loadPurchases(); }
    if (tabName === "sales") { loadSaleFormData(); loadOrders(); }
    if (tabName === "money") loadTransactions();
    if (tabName === "tasks") loadTasks();
  });
}

/* ============ chat ============ */

var chatBox = qs("chat");
var messageBox = qs("message");
var sendBtn = qs("sendBtn");
var clearBtn = qs("clearBtn");

var sessionId = localStorage.getItem("dijo_session_id") || "";
var WELCOME = "سلام! من دیجو هستم. هم می‌تونیم گپ بزنیم، هم می‌تونم مشتری، محصول، فروش، هزینه و وظایف کسب‌وکارت رو مدیریت کنم.";

function timeNow() {
  return new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
}

function addBubble(text, role, isError) {
  var row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "dijo");

  var bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;

  var meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = timeNow();

  row.appendChild(bubble);
  row.appendChild(meta);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return row;
}

var typingRowEl = null;

function addTyping() {
  var row = document.createElement("div");
  row.className = "row dijo";
  var bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = "...";
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  typingRowEl = row;
}

function removeTyping() {
  if (typingRowEl) {
    typingRowEl.remove();
    typingRowEl = null;
  }
}

function resetChat() {
  chatBox.innerHTML = "";
  sessionId = "";
  localStorage.removeItem("dijo_session_id");
  addBubble(WELCOME, "dijo");
}

function sendMessage() {
  var text = messageBox.value.trim();
  if (!text) return;

  addBubble(text, "user");
  messageBox.value = "";
  sendBtn.disabled = true;
  addTyping();

  api("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, session_id: sessionId })
  }).then(function (data) {
    removeTyping();

    if (data.session_id) {
      sessionId = data.session_id;
      localStorage.setItem("dijo_session_id", sessionId);
    }

    if (data.reply) {
      addBubble(data.reply, "dijo", data.mode === "error" || data.mode === "offline");
    } else {
      addBubble("سرور پاسخ خالی فرستاد.", "dijo", true);
    }
  }).catch(function (error) {
    removeTyping();
    addBubble("خطا در ارتباط با دیجو: " + error.message, "dijo", true);
  }).finally(function () {
    sendBtn.disabled = false;
  });
}

sendBtn.addEventListener("click", sendMessage);

function cardHtml(title, value, isProfit, isCount) {
  var cls = "";
  if (isProfit) cls = Number(value) >= 0 ? "pos" : "neg";
  var display = isCount ? fmt(value) : (fmt(value) + " تومان");
  return '<div class="card"><div class="card-title">' + escapeHtml(title) + '</div><div class="card-value ' + cls + '">' + display + "</div></div>";
}

function trendChartHtml(trend) {
  if (!trend || !trend.length) return "";

  var maxVal = 0;
  trend.forEach(function (d) { if (d.total > maxVal) maxVal = d.total; });
  if (maxVal <= 0) maxVal = 1;

  var dayNames = ["ی", "د", "س", "چ", "پ", "ج", "ش"];

  var bars = trend.map(function (d) {
    var pct = Math.max(4, Math.round((d.total / maxVal) * 100));
    var dateObj = new Date(d.date + "T00:00:00");
    var dayLabel = isNaN(dateObj.getTime()) ? "" : dayNames[dateObj.getDay()];
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">' +
      '<div style="font-size:10px;color:var(--text-dim);">' + fmt(d.total) + '</div>' +
      '<div style="width:100%;max-width:28px;height:90px;display:flex;align-items:flex-end;">' +
      '<div style="width:100%;height:' + pct + '%;background:var(--accent);border-radius:6px 6px 2px 2px;"></div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-dim);">' + dayLabel + '</div>' +
      '</div>';
  }).join("");

  return '<div class="section-label">روند فروش ۷ روز اخیر</div>' +
    '<div class="card" style="display:flex;gap:6px;align-items:flex-end;padding:16px 10px;">' + bars + '</div>';
}

  if (balance < 0) return '<span class="badge credit">بستانکار ' + fmt(Math.abs(balance)) + '</span>';
  return '<span class="badge settled">تسویه</span>';
}

function loadProducts() {
  var list = qs("productsList");
  list.innerHTML = '<div class="empty-hint">در حال بارگذاری...</div>';

  api("/api/products").then(function (products) {
    if (!products.length) {
      list.innerHTML = '<div class="empty-hint">هنوز محصولی ثبت نشده.</div>';
      return;
    }
    var html = "";
    products.forEach(function (p) {
      var price = Number(p.price || 0);
      var cost = Number(p.cost_price || 0);
      var margin = price - cost;
      var marginPct = cost > 0 ? Math.round((margin / cost) * 100) : null;
      var profitTag = "";
      if (cost > 0) {
        var pctColor = margin >= 0 ? "var(--success)" : "var(--error)";
        profitTag = ' <span style="font-size:11px;padding:2px 7px;border-radius:12px;background:rgba(255,255,255,0.07);color:' + pctColor + ';">' +
          (margin >= 0 ? "+" : "") + marginPct + "٪</span>";
      }
      var subParts = ["فروش: " + fmt(price)];
      if (cost > 0) {
        subParts.push("خرید: " + fmt(cost));
        subParts.push("سود واحد: " + fmt(margin));
      }
      subParts.push("موجودی: " + fmt(p.stock));
      html += '<div class="list-item">' +
        '<div class="info"><div class="title">' + escapeHtml(p.name) + profitTag + '</div>' +
        '<div class="sub">' + subParts.join(" · ") + '</div></div>' +
        (p.stock <= 5 ? '<span class="badge low">کم</span>' : "") +
        '<button class="del-btn" data-id="' + p.id + '" data-kind="product">حذف</button>' +
        '</div>';
    });
    list.innerHTML = html;
  }).catch(function (e) {
    list.innerHTML = '<div class="empty-hint">خطا: ' + escapeHtml(e.message) + "</div>";
  });
}

function loadProductProfit(days) {
  var list = qs("productProfitList");
  if (!list) return;
  list.innerHTML = '<div class="empty-hint">در حال بارگذاری...</div>';

  api("/api/products/profit?days=" + (days || 30)).then(function (items) {
    if (!items.length) {
      list.innerHTML = '<div class="empty-hint">در این بازه فروشی با قیمت تمام‌شده ثبت نشده.</div>';
      return;
    }
    var html = "";
    items.forEach(function (p, idx) {
      var revenue = Number(p.revenue || 0);
      var cost = Number(p.cost || 0);
      var profit = Number(p.profit || 0);
      var profitPct = cost > 0 ? Math.round((profit / cost) * 100) : null;
      var pctStr = profitPct !== null ? ((profit >= 0 ? "+" : "") + profitPct + "٪") : "—";
      var badgeClass = profit >= 0 ? "credit" : "debt";
      var medals = ["🥇", "🥈", "🥉"];
      var rank = idx < 3 ? medals[idx] + " " : "";
      var barWidth = items[0].profit > 0 ? Math.max(4, Math.round((profit / items[0].profit) * 100)) : 4;
      html += '<div class="card" style="padding:12px 14px;margin-bottom:8px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<span style="font-size:14.5px;font-weight:bold;">' + rank + escapeHtml(p.product_name) + '</span>' +
        '<span class="badge ' + badgeClass + '">' + fmt(profit) + ' ت · ' + pctStr + '</span>' +
        '</div>' +
        '<div style="height:5px;background:rgba(255,255,255,0.07);border-radius:4px;margin-bottom:8px;">' +
        '<div style="height:5px;width:' + barWidth + '%;background:' + (profit >= 0 ? 'var(--success)' : 'var(--error)') + ';border-radius:4px;"></div>' +
        '</div>' +
        '<div style="display:flex;gap:14px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;">' +
        '<span>تعداد فروش: <b style="color:var(--text)">' + fmt(p.qty_sold) + '</b></span>' +
        '<span>درآمد: <b style="color:var(--text)">' + fmt(revenue) + '</b></span>' +
        '<span>بهای تمام‌شده: <b style="color:var(--text)">' + fmt(cost) + '</b></span>' +
        '</div>' +
        '</div>';
    });
    list.innerHTML = html;
  }).catch(function (e) {
    list.innerHTML = '<div class="empty-hint">خطا: ' + escapeHtml(e.message) + "</div>";
  });
}

  document.querySelectorAll(".profit-period").forEach(function (b) { b.classList.remove("active"); });

      amount: Number(amount),
      kind: qs("tx-kind").value,
      category: qs("tx-category").value.trim()
    })
  }).then(function () {
    qs("tx-title").value = "";
    qs("tx-amount").value = "";
    qs("tx-category").value = "";
    loadTransactions();
  }).catch(function (e) { alert("خطا: " + e.message); });
});

/* ============ tasks ============ */

function loadTasks() {
  var list = qs("tasksList");
  list.innerHTML = '<div class="empty-hint">در حال بارگذاری...</div>';

  api("/api/tasks").then(function (tasks) {
    if (!tasks.length) {
      list.innerHTML = '<div class="empty-hint">هنوز وظیفه‌ای ثبت نشده.</div>';
      return;
    }
    var html = "";
    tasks.forEach(function (t) {
      html += '<div class="list-item">' +
        '<button class="check-btn ' + (t.done ? "done" : "") + '" data-id="' + t.id + '" data-kind="task-toggle">' + (t.done ? "✓" : "") + '</button>' +
        '<div class="info"><div class="title" style="' + (t.done ? "text-decoration:line-through;color:var(--text-dim)" : "") + '">' + escapeHtml(t.title) + '</div>' +
        '<div class="sub">' + escapeHtml(t.due_date || "") + '</div></div>' +
        '<button class="del-btn" data-id="' + t.id + '" data-kind="task">حذف</button>' +
        '</div>';
    });
    list.innerHTML = html;
  }).catch(function (e) {
    list.innerHTML = '<div class="empty-hint">خطا: ' + escapeHtml(e.message) + "</div>";
  });
}

qs("addTaskBtn").addEventListener("click", function () {
  var title = qs("task-title").value.trim();
  if (!title) { alert("عنوان وظیفه را وارد کن."); return; }

  api("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: title, due_date: qs("task-due").value.trim() })
  }).then(function () {
    qs("task-title").value = "";
    qs("task-due").value = "";
    loadTasks();
  }).catch(function (e) { alert("خطا: " + e.message); });
});

/* ============ delete/toggle delegation (customers/products/orders/transactions/tasks) ============ */

document.body.addEventListener("click", function (event) {
  var btn = event.target.closest("[data-kind]");
  if (!btn) return;

  var kind = btn.getAttribute("data-kind");
  var id = btn.getAttribute("data-id");

  if (kind === "customer") {
    if (!confirm("این مشتری حذف شود؟")) return;
    if (!confirm("⚠️ تأیید دوم: حذف مشتری و تمام سابقه بدهی‌هایش برگشت‌ناپذیر است. ادامه می‌دهید؟")) return;
    api("/api/customers/" + id, { method: "DELETE" }).then(loadCustomers).catch(function (e) { alert(e.message); });
  } else if (kind === "product") {
    if (!confirm("این محصول حذف شود؟")) return;
    if (!confirm("⚠️ تأیید دوم: حذف محصول برگشت‌ناپذیر است. ادامه می‌دهید؟")) return;
    api("/api/products/" + id, { method: "DELETE" }).then(loadProducts).catch(function (e) { alert(e.message); });
  } else if (kind === "order") {
    if (!confirm("این فروش حذف شود؟ (موجودی برنمی‌گردد)")) return;
    if (!confirm("⚠️ تأیید دوم: حذف سفارش برگشت‌ناپذیر است و موجودی اصلاح نمی‌شود. ادامه؟")) return;
    api("/api/orders/" + id, { method: "DELETE" }).then(loadOrders).catch(function (e) { alert(e.message); });
  } else if (kind === "purchase") {
    if (!confirm("این خرید حذف شود؟ (موجودی و قیمت تمام‌شده محصول برنمی‌گردد)")) return;
    api("/api/purchases/" + id, { method: "DELETE" }).then(loadPurchases).catch(function (e) { alert(e.message); });
  } else if (kind === "transaction") {
    if (!confirm("این تراکنش حذف شود؟")) return;
    api("/api/transactions/" + id, { method: "DELETE" }).then(loadTransactions).catch(function (e) { alert(e.message); });
  } else if (kind === "task") {
    if (!confirm("این وظیفه حذف شود؟")) return;
    api("/api/tasks/" + id, { method: "DELETE" }).then(loadTasks).catch(function (e) { alert(e.message); });
  } else if (kind === "task-toggle") {
    if (btn.classList.contains("done")) return;
    api("/api/tasks/" + id + "/done", { method: "POST" }).then(loadTasks).catch(function (e) { alert(e.message); });
  } else if (kind === "debt-add" || kind === "debt-payment") {
    var isDebt = kind === "debt-add";
    var promptLabel = isDebt ? "مبلغ بدهی جدید (تومان):" : "مبلغ پرداختی (تومان):";
    var amountStr = prompt(promptLabel);
    if (amountStr === null) return;
    var amount = Number(amountStr.trim());
    if (!amount || amount <= 0) { alert("مبلغ نامعتبر است."); return; }
    var note = prompt("توضیح (اختیاری):") || "";
    api("/api/customers/" + id + "/ledger", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: isDebt ? "debt" : "payment", amount: amount, note: note.trim() })
    }).then(function (res) {
      alert("مانده حساب جدید: " + fmt(res.balance) + " تومان");
      loadCustomers();
    }).catch(function (e) { alert("خطا: " + e.message); });
  }
});
</script>
