{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>مرجوعی فاکتور #{{sale.id}}</h1><p>تعداد مرجوعی را برای هر کالا وارد کنید.</p></div></div>
<section class="panel narrow-panel"><form method="post" class="form-grid"><div class="table-wrap"><table><thead><tr><th>محصول</th><th>فروخته‌شده</th><th>مرجوعی</th></tr></thead><tbody>{% for i in items %}<tr><td>{{i.name}}</td><td>{{"%.0f"|format(i.qty)}}</td><td><input type="number" name="qty_{{i.product_id}}" min="0" max="{{i.qty}}" step="1" value="0"></td></tr>{% endfor %}</tbody></table></div><button class="btn primary">ثبت مرجوعی و افزایش موجودی</button></form></section>
{% endblock %}
